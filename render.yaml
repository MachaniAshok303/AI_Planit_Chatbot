services:
  - type: web
    name: planitshop-chatbot
    env: python
    region: oregon
    buildCommand: pip install -r 01_ChatBot/shopeasy_chatbot/01_chatbot/backend/requirements.txt || pip install -r backend/requirements.txt
    startCommand: cd 01_ChatBot/shopeasy_chatbot/01_chatbot/backend 2>/dev/null || cd backend ; uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHATBOT_MODEL
        value: llama-3.3-70b-versatile
      - key: AMPLIFY_API_KEY
        sync: false
      - key: AMPLIFY_API_URL
        sync: false

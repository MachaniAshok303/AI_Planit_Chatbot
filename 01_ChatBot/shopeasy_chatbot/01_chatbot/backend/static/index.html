<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanitShop — Support Chat</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
* { box-sizing: border-box; }
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --ink: #16241a;
  --mute: #586b5c;
  --accent: #f05023;
  --accent-soft: #fdeee9;
  --border: #d4ded6;
  --ok: #2e7d32;
  --warn: #d97706;
}
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 760px;
  margin: 0 auto;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--border);
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #ffffff 0%, #f4f6f4 100%);
}
.brand { display: flex; gap: 14px; align-items: center; }
.brand-logo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.tagline { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.status {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
  color: var(--mute);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); }
.badge {
  background: var(--accent-soft);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.chat {
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--bg);
}
.bubble {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  max-width: 85%;
}
.bubble.user { align-self: flex-end; flex-direction: row-reverse; }
.avatar {
  font-size: 22px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
}
.content {
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  line-height: 1.55;
  white-space: pre-wrap;
}
.bubble.user .content {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mute);
  animation: pulse 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
  40% { opacity: 1; transform: scale(1.2); }
}
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 24px;
  border-top: 1px solid var(--border);
  background: #ffffff;
}
.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }
.composer {
  display: flex;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.composer input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font: inherit;
  font-size: 15px;
  background: var(--bg);
  outline: none;
}
.composer input:focus { border-color: var(--accent); background: var(--surface); }
.composer button {
  padding: 12px 22px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: filter 0.15s;
}
.composer button:hover:not(:disabled) { filter: brightness(1.05); }
.composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect, useRef } = React;

const SUGGESTIONS = [
  "What's your refund policy?",
  "How long does standard shipping take?",
  "Tell me about the SP-EARBUDS-01.",
  "How do I reset my password?",
  "Can I return a hoodie after 35 days?",
];

const API_BASE = window.location.port === "5173" ? "http://localhost:8201" : "";

function App() {
  const [messages, setMessages] = useState([
    {
      role: "assistant",
      content: "Hi! I'm PlanitBot, your PlanitShop support assistant. Ask me about orders, shipping, refunds, or products.",
    },
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [model, setModel] = useState("");
  const [mode, setMode] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    fetch(`${API_BASE}/health`)
      .then((r) => r.json())
      .then((d) => setModel(d.model))
      .catch(() => setModel("offline"));
  }, []);

  useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
  }, [messages, loading]);

  async function send(text) {
    const msg = (text ?? input).trim();
    if (!msg || loading) return;
    const next = [...messages, { role: "user", content: msg }];
    setMessages(next);
    setInput("");
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: msg,
          history: messages.filter((m) => m.role !== "system"),
        }),
      });
      const data = await res.json();
      setMode(data.mode);
      setMessages([...next, { role: "assistant", content: data.reply }]);
    } catch (e) {
      setMessages([...next, { role: "assistant", content: `Error: ${e.message}` }]);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="app">
      <header className="header">
        <div className="brand">
          <img src="/logo.png" alt="PlanitShop Logo" className="brand-logo" />
          <div>
            <h1>PlanitShop</h1>
            <p className="tagline">Customer Support · PlanitBot</p>
          </div>
        </div>
        <div className="status">
          <span className={`dot ${mode === "mock" ? "warn" : "ok"}`}></span>
          <span className="model">{model || "…"}</span>
          {mode === "mock" && <span className="badge">mock mode</span>}
        </div>
      </header>

      <main className="chat" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={`bubble ${m.role}`}>
            <div className="avatar">{m.role === "user" ? "🙂" : "🤖"}</div>
            <div className="content">{m.content}</div>
          </div>
        ))}
        {loading && (
          <div className="bubble assistant">
            <div className="avatar">🤖</div>
            <div className="content typing"><span></span><span></span><span></span></div>
          </div>
        )}
      </main>

      <div className="suggestions">
        {SUGGESTIONS.map((s) => (
          <button key={s} className="chip" onClick={() => send(s)} disabled={loading}>
            {s}
          </button>
        ))}
      </div>

      <form
        className="composer"
        onSubmit={(e) => {
          e.preventDefault();
          send();
        }}
      >
        <input
          type="text"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          placeholder="Ask about orders, shipping, refunds, products…"
          disabled={loading}
        />
        <button type="submit" disabled={loading || !input.trim()}>
          {loading ? "…" : "Send"}
        </button>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
